spring.application.name=v-mazz
server.port=8080

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:file:./data/vmazzdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Elastic Search

spring.elasticsearch.uris=http://localhost:9200
#
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=nomic-embed-text

portal.url = http://localhost:4200

# --- added by refactor ---
# Push SQL rows into Elasticsearch on start (dev only; set false in production)
app.reindex-on-startup=true
spring.jpa.open-in-view=false
logging.level.com.example.catalog=INFO

# Alternate MPN suggestions: minimum vector similarity (raise for stricter matches)
app.alternates.min-similarity=${ALTERNATES_MIN_SIMILARITY:0.70}

# BOM matching: confidence needed (0-100) to auto-match / to suggest for review.
# Tune against your own data and embedding model.
app.bom.matched-threshold=${BOM_MATCHED_THRESHOLD:85}
app.bom.review-threshold=${BOM_REVIEW_THRESHOLD:70}

# ---------------- v-Mazz e-procurement portal ----------------
# JWT signing secret (HS256): at least 32 characters. OVERRIDE with VMAZZ_JWT_SECRET outside local development.
vmazz.jwt.secret=${VMAZZ_JWT_SECRET:v-mazz-dev-only-secret-change-before-production-0123456789}
vmazz.jwt.expiry-minutes=${VMAZZ_JWT_EXPIRY_MINUTES:120}

# Demo data (company, users, items) created at start-up when the users table is empty.
vmazz.seed.enabled=${VMAZZ_SEED_ENABLED:true}
vmazz.seed.password=${VMAZZ_SEED_PASSWORD:Password@123}

# Persistent image uploads (store outside the source tree in production)
vmazz.upload-dir=${VMAZZ_UPLOAD_DIR:./uploads}

# Registration emails are enabled only after SMTP credentials are configured
vmazz.email-notifications.enabled=${VMAZZ_EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
